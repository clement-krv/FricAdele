# Docker Compose pour l'assistant IA
# Démarrer ChromaDB et Redis nécessaires pour l'assistant

version: '3.8'

services:
  # ChromaDB - Base de données vectorielle
  chromadb:
    image: ghcr.io/chroma-core/chroma
    container_name: fricadele_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/data
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - CHROMA_PERSIST_DIRECTORY=/data
    restart: unless-stopped
    networks:
      - fricadele_network

  # Redis - Cache et session management
  redis:
    image: redis:7-alpine
    container_name: fricadele_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - fricadele_network

  # Neo4j - Base de données graphe pour relations complexes
  neo4j:
    image: neo4j:5
    container_name: fricadele_neo4j
    ports:
      - "7474:7474"  # Interface web Neo4j Browser
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/passw0rd
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    restart: unless-stopped
    networks:
      - fricadele_network

volumes:
  chromadb_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  fricadele_network:
    driver: bridge
